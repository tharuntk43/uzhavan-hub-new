name: Deploy Uzhavan Hub to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build frontend output
        run: |
          mkdir -p dist
          # Copy entry point and fallback
          cp client/index.html dist/index.html 2>/dev/null || cp index.html dist/index.html
          cp 404.html dist/404.html 2>/dev/null || cp dist/index.html dist/404.html
          touch dist/.nojekyll
          # Copy public static assets
          cp -r assets dist/ 2>/dev/null || true
          cp -r client/public/* dist/ 2>/dev/null || true
          cp *.jpg *.png *.svg *.js *.json dist/ 2>/dev/null || true
          # Strictly purge any database, server, or secret files from artifact
          rm -f dist/*.db* dist/*.sqlite* dist/*.db-wal dist/*.db-shm dist/*.env*

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
